<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · SpeakSmith</title>
<meta name="robots" content="noindex">
<script>
/* GitHub Pages bu dosyayı yalnız depo kökünden okur, bu yüzden adresler mutlaktır.
   Web uygulaması hash yönlendirmesi kullanır (/#/...): uygulama klasörünün altına düşen
   bir yol gelirse sorgu ve # korunarak uygulamanın köküne dönülür. */
(function () {
  var app = '/SpeakSmith-App/uygulama/';
  if (location.pathname.indexOf(app) === 0 && location.pathname !== app) {
    location.replace(location.origin + app + location.search + location.hash);
  }
  try { var t = localStorage.getItem('ss-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
})();
</script>
<link rel="icon" href="/SpeakSmith-App/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/SpeakSmith-App/assets/site.css">
<style>
.nf{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px var(--gutter)}
.nf .code{font:700 clamp(80px,18vw,180px)/1 var(--display);letter-spacing:-.05em;background:linear-gradient(120deg,#8F88FF,#E879A9);-webkit-background-clip:text;background-clip:text;color:transparent}
.nf h1{font-size:clamp(28px,4vw,40px);margin-top:12px}
.nf p{color:var(--ink-2);margin-top:12px}
.nf .cta-row{justify-content:center;margin-top:28px}
</style>
</head>
<body class="night">
<main class="nf">
  <div>
    <p class="code" aria-hidden="true">404</p>
    <h1>Bu sayfa yok.</h1>
    <p>Aradığın adres taşınmış ya da hiç olmamış olabilir. <span lang="en">This page doesn’t exist.</span></p>
    <div class="cta-row">
      <a class="btn btn-primary" href="/SpeakSmith-App/">Ana sayfaya dön</a>
      <a class="btn btn-ghost" href="/SpeakSmith-App/uygulama/"><span class="stack">Tarayıcıda dene<small>ilk açılış ~7–14 MB</small></span></a>
      <a class="btn btn-ghost" href="/SpeakSmith-App/en/" lang="en">English</a>
    </div>
  </div>
</main>
</body>
</html>
